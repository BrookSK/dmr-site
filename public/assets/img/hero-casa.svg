<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" role="img" aria-label="Ilustração da casa própria">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eee5"/>
      <stop offset="1" stop-color="#eae6df"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbae6c"/>
      <stop offset="1" stop-color="#9c7b2c"/>
    </linearGradient>
  </defs>
  <rect width="520" height="560" rx="24" fill="url(#sky)"/>
  <!-- Casa -->
  <g transform="translate(110 120)">
    <path d="M150 0 300 120H0Z" fill="url(#roof)"/>
    <rect x="30" y="120" width="240" height="200" fill="#fff" stroke="#e0d8c8" stroke-width="2"/>
    <rect x="125" y="210" width="50" height="110" fill="#a3805f"/>
    <circle cx="165" cy="265" r="4" fill="#cbae6c"/>
    <rect x="60" y="150" width="50" height="50" fill="#eae6df" stroke="#d9d1c4" stroke-width="2"/>
    <rect x="190" y="150" width="50" height="50" fill="#eae6df" stroke="#d9d1c4" stroke-width="2"/>
  </g>
  <!-- Chave dourada -->
  <g transform="translate(300 360) rotate(35)" fill="#9c7b2c">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#9c7b2c" stroke-width="10"/>
    <rect x="22" y="-6" width="90" height="12" rx="3"/>
    <rect x="96" y="-6" width="12" height="26" rx="2"/>
    <rect x="78" y="-6" width="10" height="20" rx="2"/>
  </g>
</svg>
